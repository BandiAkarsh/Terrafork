services:
  # Frontend - SvelteKit 5 Static Site
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - PUBLIC_API_URL=http://localhost:8788
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Microservice: TypeScript Scraper (Cloudflare Workers)
  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    ports:
      - "8788:8788"
    volumes:
      - ./services/scraper:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/"]
      interval: 30s
      timeout: 10s
      retries: 3
