version: '3.8'

services:
  # Frontend - SvelteKit 5 Static Site
  web:
    build: 
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - PUBLIC_API_URL=http://localhost:8000
    # Green Code: Resource limits to prevent energy waste
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Microservice: Python Scraper (FastAPI)
  scraper:
    build: 
      context: ./services/scraper
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/scraper:/app
    # Green Code: Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Green Code: Auto-shutdown after 1 hour of inactivity (optional)
    # profiles: ["on-demand"]  # Uncomment to run only when needed
