name: Green CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Frontend Check (Node.js)
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type Check & Lint (Web)
        run: |
          cd apps/web
          pnpm check
          # pnpm lint (Enable later when eslint is configured)

  # 2. Backend Check (Python)
  scraper-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd services/scraper
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff (Green Code: Fast Rust-based linter)
        run: |
          cd services/scraper
          ruff check .
