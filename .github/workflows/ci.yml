name: Green CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Frontend Check (Node.js)
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type Check & Lint (Web)
        run: |
          cd apps/web
          pnpm check
          pnpm run lint

  # 2. Backend Check (TypeScript)
  scraper-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd services/scraper
          pnpm install

      - name: Type Check & Lint (Scraper)
        run: |
          cd services/scraper
          pnpm run lint
          pnpm run check
