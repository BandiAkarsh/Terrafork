name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Frontend
        run: |
          cd apps/web
          pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: terrafork
          directory: apps/web/build
          branch: main
          # Optional: Enable this if you want a separate comment on PRs
          # comment-on-pull-request: true

  # Note: Python Worker deployment requires manual setup or separate workflow
  # due to Python Workers being in beta and requiring pywrangler CLI
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Python Worker (Manual Step)
        run: |
          echo "To deploy the Python Worker:"
          echo "1. Install wrangler: npm install -g wrangler"
          echo "2. Authenticate: wrangler login"
          echo "3. Deploy: cd services/scraper && wrangler deploy"
          echo ""
          echo "Then update apps/web/src/routes/+page.svelte:"
          echo "Change API_BASE to your deployed worker URL"